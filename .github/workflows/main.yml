name: Build portable Windows app

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - '**.ps1'
      - '**.cmd'
      - '**.png'
      - '**.ico'
      - 'samples/**'
      - '.github/workflows/build-windows.yml'

# Для створення GitHub Release (лише при тезі v*) потрібен запис у contents.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          $version = ([xml](Get-Content .\DocumentGenerator.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'Version not found in DocumentGenerator.csproj' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Restore dependencies
        run: dotnet restore .\DocumentGenerator.csproj --runtime win-x64

      - name: Publish self-contained single-file app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "Docugen-${{ steps.ver.outputs.version }}-portable-win-x64"
          $package = Join-Path $env:GITHUB_WORKSPACE "publish\$name"
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          dotnet publish .\DocumentGenerator.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output $package
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }

          # Перевірка, що збірка справді дала робочий exe.
          $exe = Join-Path $package 'DocumentGenerator.exe'
          if (-not (Test-Path $exe)) { throw 'DocumentGenerator.exe was not produced.' }
          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          if ($sizeMb -lt 10) { throw "DocumentGenerator.exe is suspiciously small ($sizeMb MB)." }
          Write-Host "DocumentGenerator.exe: $sizeMb MB"

          # Додатки до портативного пакета.
          Copy-Item .\README.md (Join-Path $package 'README.txt')
          Copy-Item .\App.ico $package
          Copy-Item .\create-shortcut.ps1 $package
          Copy-Item .\Create-Shortcut.cmd $package
          if (Test-Path .\samples) { Copy-Item .\samples (Join-Path $package 'samples') -Recurse -Force }

          $zip = Join-Path $env:GITHUB_WORKSPACE "publish\$name.zip"
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $zip -Force
          "ZIP_PATH=$zip" >> $env:GITHUB_ENV
          "ZIP_NAME=$name" >> $env:GITHUB_ENV
          Write-Host "Portable package created: $zip"

      - name: Upload portable ZIP (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 30

      # Створює Release автоматично, коли ви ставите тег, наприклад: git tag v0.6.0 && git push --tags
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:ZIP_PATH" `
            --title "Docugen ${{ steps.ver.outputs.version }}" `
            --generate-notes
